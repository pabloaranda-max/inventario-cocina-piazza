<script>
    (() => {
      const slides = [...document.querySelectorAll('.slide')];
      const rail = document.getElementById('rail');
      const progress = document.getElementById('progress');
      let current = 0;

      slides.forEach((slide, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.setAttribute('aria-label', slide.dataset.title);
        button.addEventListener('click', () => slide.scrollIntoView({ behavior: 'smooth' }));
        rail.appendChild(button);
      });

      const dots = [...rail.querySelectorAll('button')];
      const setCurrent = (index) => {
        current = index;
        dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
        progress.style.width = `${((index + 1) / slides.length) * 100}%`;
        document.title = `${slides[index].dataset.title} · Inventario // OS`;
      };

      const observer = new IntersectionObserver((entries) => {
        const visible = entries
          .filter(entry => entry.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (visible) setCurrent(slides.indexOf(visible.target));
      }, { threshold: [0.42, 0.65] });

      slides.forEach(slide => observer.observe(slide));
      setCurrent(0);

      const go = (delta) => {
        const target = Math.max(0, Math.min(slides.length - 1, current + delta));
        slides[target].scrollIntoView({ behavior: 'smooth' });
      };

      document.getElementById('prev').addEventListener('click', () => go(-1));
      document.getElementById('print').addEventListener('click', () => window.print());
      window.addEventListener('keydown', (event) => {
        if (['ArrowDown', 'PageDown', ' '].includes(event.key)) {
          event.preventDefault();
          go(1);
        } else if (['ArrowUp', 'PageUp'].includes(event.key)) {
          event.preventDefault();
          go(-1);
        } else if (event.key === 'Home') {
          event.preventDefault();
          slides[0].scrollIntoView({ behavior: 'smooth' });
        } else if (event.key === 'End') {
          event.preventDefault();
          slides.at(-1).scrollIntoView({ behavior: 'smooth' });
        }
      });
    })();
  </script>
