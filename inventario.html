// Informa, no ofrece. Este equipo abre siempre su propia toma; saber que alguien
// más ya está contando el almacén evita que dos personas crean que llevan tomas
// separadas el mismo día, sin darles un botón que reemplace su captura.
function avisoTomasDelAlmacen() {
  if (!_tomasAlmacen.length) return '';
  const hoy = fechaOperativaCDMX();
  const deHoy = _tomasAlmacen.find(s => s.fecha === hoy);
  const previa = _tomasAlmacen.find(s => s.fecha !== hoy && !s.exportedAt);
  let html = '';
  if (deHoy) {
    const quienes = (deHoy.operarios && deHoy.operarios.length)
      ? deHoy.operarios.join(' · ') : (deHoy.operario || '—');
    // Mismo (almacén, fecha) = misma fila en D1, y cada equipo escribe su propia
    // rebanada `zonaIdx:dispositivo`: los conteos se suman, no se pisan.
    html += `<div class="card" style="border-left:4px solid #0ea5e9;margin-bottom:12px">
      <div style="font-weight:700;margin-bottom:2px">${ic('store',15)} Ya hay una toma de hoy en este almacén</div>
      <div style="font-size:13px;color:#888">${esc(quienes)} · ${deHoy.articulosContados || 0} artículos contados</div>
      <div style="font-size:12px;color:#0369a1;margin-top:6px">Tu conteo se suma al de ellos por zona. Toma zonas distintas para no contar lo mismo dos veces.</div>
    </div>`;
  }
  if (previa) {
    html += `<div class="card" style="border-left:4px solid #f59e0b;margin-bottom:12px">
      <div style="font-weight:700;margin-bottom:2px">${ic('triangle-alert',15)} Hay una toma sin cerrar del ${esc(previa.fecha)}</div>
      <div style="font-size:12px;color:#b45309;margin-top:4px">No la retomas desde aquí: cuenta normal y el admin la unirá con la de hoy si son el mismo conteo.</div>
    </div>`;
  }
  return html;
}

async function confirmNewSession() {
  if (!confirm('¿Iniciar nueva toma? Se perderán los conteos actuales.')) return;
  S = null; lsDel('s');
  // La sesión vieja pudo renderizarse desde su snapshot: re-resolver zonas actuales
  ZONAS = await resolveZonas();
  renderAreaWelcome();
}

// ── Sesión ─────────────────────────────────────────────────────────────────

async function startSession() {
  const operario = document.getElementById('inp-operario').value.trim();
  const fecha    = document.getElementById('inp-fecha').value;
  if (!operario) { alert('Ingresa tu nombre'); return; }
  if (!fecha)    { alert('Selecciona la fecha'); return; }

  // Si el almacén ya tiene toma de esta fecha, este equipo cuenta CONTRA EL MISMO
  // mapa de zonas. No es adoptar la toma —no llega ni un conteo— pero las
  // rebanadas se guardan como `zonaIdx:dispositivo`: si el admin editó la
  // preparación a media jornada, el "índice 2" de este equipo no sería el
  // "índice 2" congelado y su captura quedaría bajo el nombre de zona ajeno.
  // El Worker ya protege el dato (zone_snapshot es first-write-wins); esto
  // protege lo que el operario cree que está contando.
  let zonas = ZONAS;
  let zoneConfigId = ZCFG?.id || '';
  let snapshotSynced = false;
  let propio = estadoPropioDeSesion(null);
  // Doble toque en un teléfono lento: sin esto salen dos sesiones y dos syncs.
  const btn = document.getElementById('btn-iniciar-toma');
  if (btn?.disabled) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Preparando…'; }
  try {
    // Sin red devuelve null y se arranca con las zonas locales: nunca bloquea.
    const yaEnServidor = await fetchSesionWorker(fecha);
    if (yaEnServidor?.zoneSnapshot?.length) {
      zonas = yaEnServidor.zoneSnapshot;
      zoneConfigId = yaEnServidor.zoneConfigId || zoneConfigId;
      snapshotSynced = true;   // el del servidor manda; no reenviar el propio
      ZONAS = zonas;
    }
    if (yaEnServidor) propio = estadoPropioDeSesion(yaEnServidor);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Iniciar →'; }
  }

  // Snapshot §14: la toma congela zonas/orden/activos con los que inició — editar
  // la preparación después no la altera. Se envía al Worker en el primer sync.
  S = { operario, fecha, templateHash: T?.templateHash||'', countsByZone:propio.countsByZone, presChoiceByZone:propio.presChoiceByZone, correctionsByZone:propio.correctionsByZone, completedZones:propio.completedZones, manuales:propio.manuales, reopenedZones:{}, pendingCompletedZoneRemovals:[], receipts:propio.receipts, pendingReceiptEvents:{},
        zoneConfigId, zoneSnapshot: JSON.parse(JSON.stringify(zonas || [])), snapshotSynced };
  lsSet('s', S);
  syncSesionWorker();
  go('overview');
}

// ── Conteo ─────────────────────────────────────────────────────────────────

async function startCount(zoneIdx) {
  // Bloquear solo si ESTE dispositivo ya completó esta zona
  if ((S.completedZones||[]).indexOf(myZoneKey(zoneIdx)) !== -1) return;
  // Si otro dispositivo está contando la misma zona, el overview lo muestra — pero no bloqueamos
  lockZone(zoneIdx, false).catch(() => {}); // registrar presencia; no bloquear si falla
  _remoteLockedZones[zoneIdx] = { device_id: getDeviceId(), operario: S.operario };
  _lastZoneClosedMsg = '';
  CZ = zoneIdx;
  const zone = ZONAS[zoneIdx];
  document.getElementById('count-zone-name').textContent = zone.nombre;
  document.getElementById('count-hdr').style.background = zone.color;
  document.getElementById('count-search').value = '';
  renderCountList(zone.items, myZoneKey(zoneIdx));
  updateProgress();
  updateManualesBadge();
  go('count');
}

function reopenZone(zoneIdx) {
  const zid = myZoneKey(zoneIdx);
  const zone = ZONAS[zoneIdx];
  if ((S.completedZones||[]).indexOf(zid) === -1) {
    startCount(zoneIdx);
    return;
  }
  if (!confirm(
    `Reabrir y modificar "${zone.nombre}"?\n\n` +
    'La zona dejará de aparecer como CERRADA mientras editas. ' +
    'Los cambios posteriores quedarán marcados como corrección en Admin y Sheets.'
  )) return;
  S.completedZones = (S.completedZones || []).filter(z => z !== zid);
  if (!S.reopenedZones) S.reopenedZones = {};
  if (!S.pendingCompletedZoneRemovals) S.pendingCompletedZoneRemovals = [];
  S.reopenedZones[zid] = true;
  if (!S.pendingCompletedZoneRemovals.includes(zid)) S.pendingCompletedZoneRemovals.push(zid);
  _receiptPending.delete(zid);
  if (S.pendingReceiptEvents) delete S.pendingReceiptEvents[zid];
  _lastZoneClosedMsg = `${zone.nombre} reabierta. Los cambios quedarán marcados como corrección.`;
  lsSet('s', S);
  syncSesionWorker();
  startCount(zoneIdx);
}

function getQtyForZone(zid, cod) {
  return (S.countsByZone?.[zid])?.[cod];
}

// Cada Xetux escribe las unidades a su manera: Piazza usa LT/PZA y Universal de
// Hamburguesas usa L/PZ. Comparar contra 'LT'/'PZA' a secas dejaba a UH sin el
// aviso naranja de "se mide directo, sin presentación" y con el paso de captura
// equivocado.
const UNIDAD_PESO_VOLUMEN = /^(KG|K|G|GR|GRS|LT|LTS|L|ML)$/i;
const UNIDAD_PIEZA        = /^(PZA|PZAS|PZ|PIEZA|PIEZAS|UND|U)$/i;

function getPresOptions(cod) {
  const explicit = T?.presMap?.[cod];
  if (explicit?.length) return explicit;
  const uni = T?.unitMap?.[cod] || '';
  return (T?.defaultPres?.[uni]) || [];
}

function getPresChoice(zid, cod) {
  return (S.presChoiceByZone?.[zid])?.[cod] ?? null;
}

// R11 — desglose por presentación. countsByZone[zid][cod] es polimórfico:
// número (legacy, factor vía presChoice/default) o array [{n,f,q}] con el
// factor DENTRO de cada línea; f:1 = abierto/suelto en unidad base (spec §6).
// Espejo de lineasDesglose/cantidadBase de js/sesion-merge.js — esta página es
// autocontenida (el espejo UH no copia js/): mantener ambos en sincronía.
const _desgloseOpen = new Set(); // "zid|cod" con desglose abierto pero aún sin captura

function esDesglose(val) { return Array.isArray(val); }

function cantidadBaseInv(val, factorLegacy) {
  if (Array.isArray(val)) return val.reduce((s, l) => s + (Number(l?.q) || 0) * (Number(l?.f) || 0), 0);
  return (Number(val) || 0) * factorLegacy;
}

// Líneas que ofrece el desglose: las presentaciones del artículo + siempre la
// de abierto/suelto (f:1, unidad base directa).
function lineasDePlantilla(cod) {
  return [...getPresOptions(cod).map(o => ({ n: o.nombre || '', f: o.factor })), { n: '', f: 1 }];
}

function itemSearchText(item) {
  const templateItem = _templateItemsByCod[item.cod] || null;
  const pres = getPresOptions(item.cod)
    .map(o => `${o.nombre || ''} ${o.factor || ''}`)
    .join(' ');
  return `${item.art || ''} ${templateItem?.art || ''} ${item.cod || ''} ${item.uni || ''} ${pres}`;
}

function markCorrection(zid, cod, tipo) {
  if (!S.reopenedZones?.[zid]) return;
  if (!S.correctionsByZone) S.correctionsByZone = {};
  if (!S.correctionsByZone[zid]) S.correctionsByZone[zid] = {};
  S.correctionsByZone[zid][cod] = {
    tipo,
    operario:S.operario,
    at:new Date().toISOString(),
    zona:ZONAS[baseZone(zid)]?.nombre || ''
  };
}

function hasCorrection(zid, cod) {
  return !!S.correctionsByZone?.[zid]?.[cod];
}

function renderItemRow(item, zid, inOtherZone) {
  const templateItem = _templateItemsByCod[item.cod] || null;
  const displayItem = templateItem
    ? { ...item, art: templateItem.art || item.art, uni: templateItem.uni || item.uni, grp: templateItem.grp || item.grp }
    : item;
  const raw    = getQtyForZone(zid, item.cod);
  const desglosado = esDesglose(raw) || _desgloseOpen.has(zid + '|' + item.cod);
  const flt    = typeof raw === 'number' ? raw : NaN;
  const opts   = getPresOptions(item.cod);
  const chosen = getPresChoice(zid, item.cod) ?? (opts[0]?.factor ?? null);
  const filled = raw !== undefined ? 'filled' : '';
  const corrected = hasCorrection(zid, item.cod);
  const dataZ  = `data-zid="${zid}"`;

  let presHtml = '';
  if (!desglosado && opts.length === 1) {
    const f = opts[0].factor;
    const ltStr = !isNaN(flt) ? fmtNum(flt * f) : '—';
    presHtml = `<span class="lt-badge" id="ltb_${zid}_${esc(item.cod)}">${ltStr} ${item.uni}</span>`;
  } else if (!desglosado && opts.length > 1) {
    const selOpts = opts.map(o => `<option value="${o.factor}" ${o.factor==chosen?'selected':''}>${o.nombre} (${o.factor})</option>`).join('');
    const ltStr = chosen && !isNaN(flt) ? fmtNum(flt * chosen) : (raw!==undefined?fmtNum(flt):'—');
    presHtml = `<select class="pres-sel" ${dataZ} data-cod="${esc(item.cod)}" onchange="onPresChange(this)">${selOpts}</select>
      <span class="lt-badge" id="ltb_${zid}_${esc(item.cod)}">${ltStr} ${item.uni}</span>`;
  }

  const baseUnitLabel = desglosado          ? `${displayItem.uni} · desglosado`
                      : opts.length === 1   ? `bots × ${opts[0].factor} ${displayItem.uni}`
                      : opts.length > 1     ? `${displayItem.uni} · selecciona presentación`
                      : displayItem.uni;
  const unitLabel = inOtherZone ? `disponible aquí · ${baseUnitLabel}` : baseUnitLabel;
  const unitWarn  = UNIDAD_PESO_VOLUMEN.test(displayItem.uni || '') && opts.length === 0 ? ' warn' : '';
  const inputStep = opts.length > 0 && !UNIDAD_PIEZA.test(displayItem.uni || '') ? '0.5' : '0.01';

  const comment = getComment(item.cod);
  const commentBtn = _supervisorActual
    ? `<button class="comment-btn${comment?' has-comment':''}" onclick="openCommentModal('${esc(item.cod)}','${esc(displayItem.art)}')" title="${comment?'Ver comentario':'Agregar comentario'}">${ic('message-circle',15)}</button>`
    : '';
  const commentText = comment ? `<div class="item-comment-text">${esc(comment.texto)}</div>` : '';

  let qtyHtml, desgloseHtml = '';
  if (desglosado) {
    const cur   = esDesglose(raw) ? raw : [];
    const total = cantidadBaseInv(cur, 0);
    // Líneas ofrecidas + las capturadas que ya no calzan con la plantilla
    // (p.ej. re-subida a mitad de toma) — nunca ocultar cantidad capturada.
    const ofrecidas = lineasDePlantilla(item.cod);
    const huerfanas = cur.filter(c => !ofrecidas.some(l => Number(l.f) === Number(c.f) && (l.n || '') === (c.n || '')));
    const lineaHtml = l => {
      const q = cur.find(c => Number(c.f) === Number(l.f) && (c.n || '') === (l.n || ''))?.q;
      const label = Number(l.f) === 1 ? `Abierto / suelto (${displayItem.uni} directo)` : `${l.n} (${l.f} ${displayItem.uni})`;
      return `<div class="desg-linea"><span class="desg-label">${esc(label)}</span>
        <input type="number" class="qty-input desg-input${q !== undefined ? ' filled' : ''}" inputmode="decimal"
          step="${Number(l.f) === 1 ? '0.01' : '0.5'}" min="0" placeholder="0" value="${q !== undefined ? q : ''}"
          ${dataZ} data-cod="${esc(item.cod)}" data-f="${l.f}" data-n="${esc(l.n || '')}"
          oninput="onDesgloseQty(this)" onfocus="this.select()"></div>`;
    };
    qtyHtml = `<span class="lt-badge" id="ltb_${zid}_${esc(item.cod)}">${fmtNum(total)} ${displayItem.uni}</span>`;
    desgloseHtml = `<div class="desglose-block">
      ${[...ofrecidas, ...huerfanas].map(lineaHtml).join('')}
      <div class="desg-total">
        <button class="desg-cerrar" ${dataZ} data-cod="${esc(item.cod)}" onclick="quitarDesglose(this)">Quitar desglose</button>
        = <b id="dtot_${zid}_${esc(item.cod)}">${fmtNum(total)}</b>&nbsp;${displayItem.uni}
      </div>
    </div>`;
  } else {
    const desgBtn = opts.length > 0
      ? `<button class="desg-btn" ${dataZ} data-cod="${esc(item.cod)}" onclick="toggleDesglose(this)" title="Desglosar por presentación">${ic('list-plus',18)}</button>`
      : '';
    qtyHtml = `${presHtml}
      <input type="number" class="qty-input ${filled}" inputmode="decimal"
        step="${inputStep}" min="0" placeholder="0"
        value="${raw!==undefined?raw:''}"
        ${dataZ} data-cod="${esc(item.cod)}"
        oninput="onQty(this)" onfocus="this.select()">${desgBtn}`;
  }

  return `<div class="item-row${inOtherZone?' other-zone':''}${corrected?' corrected':''}${desglosado?' desglosado':''}" data-search="${esc(itemSearchText(item))}">
    <div class="item-text">
      <div style="display:flex;align-items:flex-start;gap:4px">
        <div class="item-name" style="flex:1">${esc(displayItem.art)}</div>
        ${commentBtn}
      </div>
      <div class="item-unit${unitWarn}">${unitLabel}</div>
      ${corrected ? '<span class="correction-badge">Editado despues de cerrar</span>' : ''}
      ${commentText}
    </div>
    <div class="qty-wrap">
      ${qtyHtml}
    </div>
    ${desgloseHtml}
  </div>`;
}

function renderCountList(items, zid) {
  let html = '', lastGrp = null;
  for (const item of items) {
    if (item.grp !== lastGrp) {
      lastGrp = item.grp;
      if (item.grp) html += `<div class="subgrupo-hdr" data-grp="${esc(item.grp)}">${esc(item.grp)}</div>`;
    }
    html += renderItemRow(item, zid, false);
  }
  document.getElementById('count-list').innerHTML = html;
}

function onQty(inp) {
  const zid = inp.dataset.zid;
  const cod = inp.dataset.cod;
  const v   = inp.value.trim();
  const num = parseFloat(v);
  if (!S.countsByZone) S.countsByZone = {};
  if (!S.countsByZone[zid]) S.countsByZone[zid] = {};

  if (v !== '' && !isNaN(num) && num >= 0) {
    S.countsByZone[zid][cod] = num;
    markCorrection(zid, cod, 'cantidad');
    // Actualizar badge LT
    const chosen = getPresChoice(zid, cod) ?? (getPresOptions(cod)[0]?.factor ?? null);
    if (chosen) {
      const badge = document.getElementById('ltb_' + zid + '_' + cod);
      if (badge) badge.textContent = fmtNum(num * chosen) + ' ' + (ZONAS[CZ]?.items.find(i=>i.cod===cod)?.uni || 'LT');
    }
  } else {
    delete S.countsByZone[zid][cod];
    markCorrection(zid, cod, 'borrado');
    const badge = document.getElementById('ltb_' + zid + '_' + cod);
    if (badge) badge.textContent = '— ' + (getPresOptions(cod)[0] ? (ZONAS[CZ]?.items.find(i=>i.cod===cod)?.uni||'LT') : 'LT');
  }

  inp.classList.toggle('filled', v !== '' && !isNaN(parseFloat(v)));
  lsSet('s', S);
  scheduleSyncSesion();
  updateProgress();
}

function onPresChange(sel) {
  const zid = sel.dataset.zid;
  const cod = sel.dataset.cod;
  const f   = parseFloat(sel.value);
  if (!S.presChoiceByZone) S.presChoiceByZone = {};
  if (!S.presChoiceByZone[zid]) S.presChoiceByZone[zid] = {};
  S.presChoiceByZone[zid][cod] = f;
  markCorrection(zid, cod, 'presentacion');
  // Recalcular badge
  const qty = getQtyForZone(zid, cod);
  const badge = document.getElementById('ltb_' + zid + '_' + cod);
  if (badge && qty !== undefined) badge.textContent = fmtNum(qty * f) + ' ' + (ZONAS[CZ]?.items.find(i=>i.cod===cod)?.uni||'LT');
  lsSet('s', S);
  scheduleSyncSesion();
}

// R11b — handlers del desglose ------------------------------------------------

function findItemByCod(cod) {
  for (const z of ZONAS) { const it = z.items.find(i => i.cod === cod); if (it) return it; }
  return _templateItemsByCod[cod] || { cod, art: cod, uni: T?.unitMap?.[cod] || '', grp: '' };
}

// Reemplaza la fila en el DOM re-usando renderItemRow (conserva búsqueda activa)
function rerenderRow(el, zid, cod) {
  const row = el.closest('.item-row');
  if (!row) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = renderItemRow(findItemByCod(cod), zid, row.classList.contains('other-zone'));
  const neu = tmp.firstElementChild;
  if (row.classList.contains('search-match')) neu.classList.add('search-match');
  if (row.classList.contains('hidden')) neu.classList.add('hidden');
  row.replaceWith(neu);
}

function toggleDesglose(btn) {
  const zid = btn.dataset.zid, cod = btn.dataset.cod;
  const raw = getQtyForZone(zid, cod);
  if (typeof raw === 'number') {
    // sembrar el número previo en la línea de la presentación elegida (spec R11b)
    const f = getPresChoice(zid, cod) ?? (getPresOptions(cod)[0]?.factor ?? 1);
    const linea = lineasDePlantilla(cod).find(l => Number(l.f) === Number(f)) || { n: '', f: 1 };
    S.countsByZone[zid][cod] = [{ n: linea.n, f: linea.f, q: raw }];
    markCorrection(zid, cod, 'cantidad');
    lsSet('s', S);
    scheduleSyncSesion();
  }
  _desgloseOpen.add(zid + '|' + cod);
  rerenderRow(btn, zid, cod);
}

function quitarDesglose(btn) {
  const zid = btn.dataset.zid, cod = btn.dataset.cod;
  const raw = getQtyForZone(zid, cod);
  const tieneCaptura = esDesglose(raw) && raw.some(l => Number(l.q) > 0);
  if (tieneCaptura && !confirm('¿Quitar el desglose?\n\nSe borra lo capturado en las líneas de este artículo.')) return;
  if (esDesglose(raw)) {
    delete S.countsByZone[zid][cod];
    markCorrection(zid, cod, 'borrado');
    lsSet('s', S);
    scheduleSyncSesion();
    updateProgress();
  }
  _desgloseOpen.delete(zid + '|' + cod);
  rerenderRow(btn, zid, cod);
}

function onDesgloseQty(inp) {
  const zid = inp.dataset.zid, cod = inp.dataset.cod;
  const lineas = [];
  inp.closest('.desglose-block').querySelectorAll('.desg-input').forEach(i => {
    const v = i.value.trim();
    const q = parseFloat(v);
    const ok = v !== '' && !isNaN(q) && q >= 0;
    i.classList.toggle('filled', ok);
    if (ok) lineas.push({ n: i.dataset.n || '', f: parseFloat(i.dataset.f), q });
  });
  if (!S.countsByZone) S.countsByZone = {};
  if (!S.countsByZone[zid]) S.countsByZone[zid] = {};
  if (lineas.length) {
    S.countsByZone[zid][cod] = lineas;
    markCorrection(zid, cod, 'cantidad');
  } else {
    delete S.countsByZone[zid][cod];   // array vacío → se borra la clave (spec §6)
    markCorrection(zid, cod, 'borrado');
  }
  const total = cantidadBaseInv(lineas, 0);
  const item  = findItemByCod(cod);
  const uni   = _templateItemsByCod[cod]?.uni || item.uni || '';
  const dtot  = document.getElementById('dtot_' + zid + '_' + cod);
  if (dtot) dtot.textContent = fmtNum(total);
  const badge = document.getElementById('ltb_' + zid + '_' + cod);
  if (badge) badge.textContent = fmtNum(total) + ' ' + uni;
  lsSet('s', S);
  scheduleSyncSesion();
  updateProgress();
}

function updateProgress() {
  if (CZ === null) return;
  const zone   = ZONAS[CZ];
  const zbz    = S.countsByZone?.[myZoneKey(CZ)] || {};
  const filled = zone.items.filter(i => zbz[i.cod] !== undefined).length;
  const preferred = new Set(zone.items.map(i => i.cod));
  const extraFilled = Object.keys(zbz).filter(cod => !preferred.has(cod)).length;
  const pct    = zone.items.length ? filled / zone.items.length * 100 : 0;
  document.getElementById('count-bar').style.width = pct + '%';
  document.getElementById('count-pct').textContent =
    filled + '/' + zone.items.length + (extraFilled ? ` · +${extraFilled}` : '');
}

function hlMatch(text, q) {
  if (!q) return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const idx = text.toLowerCase().indexOf(q);
  if (idx < 0) return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const esc2 = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc2(text.slice(0,idx)) + '<mark>' + esc2(text.slice(idx,idx+q.length)) + '</mark>' + esc2(text.slice(idx+q.length));
}

function filterCount(q) {
  const ql = q.toLowerCase().trim();
  document.querySelectorAll('#count-list .item-row').forEach(r => {
    const searchStr = r.dataset.search || '';
    const matches = !!ql && matchesSearchText(searchStr, ql);
    r.classList.toggle('hidden', !!ql && !matches);
    r.classList.toggle('search-match', matches);
    const nameEl = r.querySelector('.item-name');
    if (nameEl) {
      if (!nameEl.dataset.name) nameEl.dataset.name = nameEl.textContent;
      nameEl.innerHTML = matches ? hlMatch(nameEl.dataset.name, ql) : nameEl.dataset.name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  });
  document.querySelectorAll('#count-list .subgrupo-hdr').forEach(hdr => {
    let next = hdr.nextElementSibling, vis = false;
    while (next && !next.classList.contains('subgrupo-hdr')) {
      if (next.classList.contains('item-row') && !next.classList.contains('hidden')) vis = true;
      next = next.nextElementSibling;
    }
    hdr.classList.toggle('hidden', !vis);
  });

  let extra = document.getElementById('count-extra');
  if (!extra) { extra = document.createElement('div'); extra.id = 'count-extra'; document.getElementById('count-list').after(extra); }
  if (!ql) { extra.innerHTML = ''; return; }

  const currentCods = new Set(CZ !== null ? ZONAS[CZ].items.map(i => i.cod) : []);
  const disponibles = new Map();

  // La preparación solo decide qué se ve de entrada. Al buscar, unificamos los
  // artículos preparados en otras zonas y el resto de la plantilla en UNA lista,
  // sin insinuar que el artículo pertenece a otra ubicación.
  ZONAS.forEach(zone => zone.items.forEach(item => {
    if (!currentCods.has(item.cod) && !disponibles.has(item.cod)) disponibles.set(item.cod, item);
  }));
  Object.keys(T?.rowMap || {}).forEach(cod => {
    if (currentCods.has(cod) || disponibles.has(cod)) return;
    disponibles.set(cod, _templateItemsByCod[cod] || {
      cod,
      art: cod,
      uni: T?.unitMap?.[cod] || '',
      grp: ''
    });
  });

  const matches = [...disponibles.values()].filter(item =>
    matchesSearchText(itemSearchText(item), ql)
  );
  extra.innerHTML = matches.length
    ? `<div class="subgrupo-hdr" style="background:#f0fdf4;color:#166534;border-top:2px solid #86efac">Más artículos de la plantilla · disponibles en esta zona</div>` +
      matches.map(item => renderItemRow(item, myZoneKey(CZ), true)).join('')
    : '';
}

function clearSearch() {
  document.getElementById('count-search').value = '';
  filterCount('');
  const e = document.getElementById('count-extra');
  if (e) e.innerHTML = '';
}

function exitCount() {
  if (CZ !== null) { lockZone(CZ, true); delete _remoteLockedZones[CZ]; }
  CZ = null;
  go('overview');
}

function requestZoneReceipt(zoneIdx, autoDownload = true) {
  if (!S || !ZONAS?.[zoneIdx]) return;
  const zid = myZoneKey(zoneIdx);
  const zoneCounts = S.countsByZone?.[zid] || {};
  const choices = { ...(S.presChoiceByZone?.[zid] || {}) };

  // Congelar también el factor por defecto de cada captura simple. Así el acuse
  // y el export no cambian si mañana se edita la plantilla/presentación.
  for (const [cod, raw] of Object.entries(zoneCounts)) {
    if (!Array.isArray(raw) && choices[cod] == null) {
      choices[cod] = getPresChoice(zid, cod) ?? (getPresOptions(cod)[0]?.factor ?? 1);
    }
  }
  if (!S.presChoiceByZone) S.presChoiceByZone = {};
  S.presChoiceByZone[zid] = choices;
  if (!S.pendingReceiptEvents) S.pendingReceiptEvents = {};
  if (!S.pendingReceiptEvents[zid]) S.pendingReceiptEvents[zid] = newManualId();

  _receiptPending.add(zid);
  lsSet('s', S);
  if (document.getElementById('screen-overview')?.classList.contains('active')) renderOverview();
  enviarPayloadSesion(
    { [zid]: zoneCounts },
    { [zid]: choices },
    {
      requestReceipt: true,
      receiptZoneKey: zid,
      receiptZoneName: ZONAS[zoneIdx].nombre,
      receiptEventId: S.pendingReceiptEvents[zid],
      autoDownloadReceipt: autoDownload
    }
  );
}

function registerReceipt(receipt, autoDownload) {
  if (!S || !receipt?.id) return;
  mergeServerReceipts([receipt]);
  const zid = receipt.zoneKey;
  const isCurrentEvent = S.pendingReceiptEvents?.[zid] === receipt.eventId;
  if (isCurrentEvent) {
    _receiptPending.delete(zid);
    delete S.pendingReceiptEvents[zid];
    _lastZoneClosedMsg =
      `${receipt.zoneName || 'La zona'} quedó CONFIRMADA por el servidor. ` +
      `Acuse ${receipt.id}. El PDF ${autoDownload ? 'se está descargando' : 'está disponible'}.`;
  } else {
    _lastZoneClosedMsg = S.pendingReceiptEvents?.[zid]
      ? `Llegó el acuse ${receipt.id} del cierre anterior; el cierre actual sigue confirmándose.`
      : `El servidor confirmó el acuse ${receipt.id} del cierre anterior. La zona permanece abierta para corrección.`;
  }
  lsSet('s', S);
  if (document.getElementById('screen-overview')?.classList.contains('active')) renderOverview();
  if (autoDownload) {
    downloadReceiptPdf(receipt, true).catch(error => {
      console.warn('acuse PDF:', error);
      _lastZoneClosedMsg =
        `El servidor confirmó el acuse ${receipt.id}, pero el dispositivo no pudo descargarlo automáticamente. ` +
        'Toca "Descargar PDF" en la zona cerrada.';
      if (document.getElementById('screen-overview')?.classList.contains('active')) renderOverview();
    });
  }
}

function doneZone() {
  if (CZ === null) return;
  const zone = ZONAS[CZ];
  const zid = myZoneKey(CZ);
  const zbz = S.countsByZone?.[zid] || {};
  const filled = zone.items.filter(i => zbz[i.cod] !== undefined).length;
  const preferred = new Set(zone.items.map(i => i.cod));
  const extraFilled = Object.keys(zbz).filter(cod => !preferred.has(cod)).length;
  const extraTxt = extraFilled
    ? ` También capturaste ${extraFilled} artículo${extraFilled !== 1 ? 's' : ''} adicional${extraFilled !== 1 ? 'es' : ''} de la plantilla.`
    : '';
  if (!confirm(
    `Cerrar "${zone.nombre}"?\n\n` +
    `Capturaste ${filled} de ${zone.items.length} artículos preparados en esta zona.${extraTxt}\n\n` +
    'Al confirmar quedará marcada en verde como CERRADA y los conteos se enviarán al servidor. ' +
    'Después podrás tocar su tarjeta para reabrirla y modificarla.'
  )) return;
  if ((S.completedZones||[]).indexOf(zid) === -1) {
    if (!S.completedZones) S.completedZones = [];
    S.completedZones.push(zid);
  }
  _lastZoneClosedMsg =
    `${zone.nombre} quedó CERRADA para ${S.operario}. Se está confirmando con el servidor; ` +
    'al recibir el folio se descargará el PDF. Puedes reabrirla después si necesitas corregir.';
  lsSet('s', S);
  if (CZ !== null) { lockZone(CZ, true); delete _remoteLockedZones[CZ]; }
  clearTimeout(_syncTimer);
  requestZoneReceipt(CZ, true);
  CZ = null;
  go('overview');
}

// ── Overview ───────────────────────────────────────────────────────────────

function renderOverview() {
  if (!S) { go('welcome'); return; }
  document.getElementById('ov-title').textContent = 'Toma · ' + S.fecha;
  document.getElementById('ov-meta').textContent  = S.operario + ' · ' + CFG.titulo;
  document.getElementById('ov-hdr').style.background = CFG.color;
  document.getElementById('ov-feedback').innerHTML = _lastZoneClosedMsg
    ? `<div class="zone-done-banner"><strong>Zona cerrada</strong>${esc(_lastZoneClosedMsg)}</div>`
    : '';

  // Advertencia de plantilla cambiada
  const ov_warn = document.getElementById('ov-warn');
  if (T?.templateHash && S.templateHash && T.templateHash !== S.templateHash) {
    ov_warn.innerHTML = `<div class="alert alert-warn"><div class="alert-title">${ic('triangle-alert',15)} La plantilla cambió</div>Los factores de conversión pueden diferir de cuando inició esta toma.</div>`;
  } else ov_warn.innerHTML = '';

  let total = 0, filled = 0, allDone = true;
  const myDev = ':' + getDeviceId();
  const html = ZONAS.map((zone, i) => {
    // Sumar conteos de TODOS los dispositivos para esta zona (para mostrar progreso real)
    const zbz = {};
    for (const [key, counts] of Object.entries(S.countsByZone || {})) {
      if (baseZone(key) === i) {
        for (const [cod, qty] of Object.entries(counts)) zbz[cod] = (zbz[cod]||0) + cantidadBaseInv(qty, 1);
      }
    }
	    const zoneFilled = zone.items.filter(it => zbz[it.cod] !== undefined).length;
	    const preferredCods = new Set(zone.items.map(it => it.cod));
	    const extraFilled = Object.keys(zbz).filter(cod => !preferredCods.has(cod)).length;
	    const done       = (S.completedZones||[]).indexOf(myZoneKey(i)) !== -1;
	    const zid        = myZoneKey(i);
	    const receipt    = latestReceiptForZone(zid);
	    const correctedCount = Object.keys(S.correctionsByZone?.[zid] || {}).length;
	    const pct        = zone.items.length ? Math.round(zoneFilled / zone.items.length * 100) : 0;
    total  += zone.items.length;
    filled += zoneFilled;
    if (!done) allDone = false;
    const remoteLock    = _remoteLockedZones[i];
    const otherCounting = !done && remoteLock && remoteLock.device_id !== getDeviceId();
    const myLock        = !done && remoteLock && remoteLock.device_id === getDeviceId();
	    const cls    = [done ? 'done' : (zoneFilled > 0 ? 'partial' : ''), correctedCount ? 'corrected' : ''].filter(Boolean).join(' ');
	    const status = done
	      ? '<span class="zone-status-closed">✓ CERRADA</span>'
	      : (correctedCount ? '!' : myLock ? '✎' : zoneFilled > 0 ? '...' : '○');
	    let metaLine = zoneFilled + '/' + zone.items.length + ' preparados · ' + pct + '%';
	    if (extraFilled) metaLine += ` · ${extraFilled} adicional${extraFilled !== 1 ? 'es' : ''}`;
	    if (otherCounting) metaLine += ' · ' + esc(remoteLock.operario) + ' contando';
	    if (done) metaLine += ' · Toca para reabrir y modificar';
	    const receiptAwaiting = !!S.pendingReceiptEvents?.[zid];
	    if (receipt) metaLine += ` · ${receiptAwaiting ? 'Acuse anterior' : 'Acuse'} ${esc(receipt.id)}`;
	    if (correctedCount) metaLine += ` · ${correctedCount} correccion${correctedCount!==1?'es':''}`;
	    const receiptAction = done
	      ? _receiptPending.has(zid)
	        ? '<span class="zone-receipt-pending">Confirmando servidor…</span>'
	        : receiptAwaiting
	          ? `<button class="zone-receipt-btn" onclick="event.stopPropagation();requestZoneReceipt(${i},true)">Confirmar y PDF</button>`
	          : receipt
	          ? `<button class="zone-receipt-btn" onclick="event.stopPropagation();downloadReceiptById('${esc(receipt.id)}')">Descargar PDF</button>`
	          : `<button class="zone-receipt-btn" onclick="event.stopPropagation();requestZoneReceipt(${i},true)">Confirmar y PDF</button>`
	      : '';
	    const clickAttr = done ? ` onclick="reopenZone(${i})"` : ` onclick="startCount(${i})"`;
    return `<div class="zone-card ${cls}"${clickAttr}>
      <div class="zone-dot" style="background:${zone.color}"></div>
      <div class="zone-info">
        <div class="zone-name">${esc(zone.nombre)}</div>
        <div class="zone-meta">${metaLine}</div>
        <div class="progress-bar" style="margin-top:4px"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="zone-status">${status}${receiptAction}</div>
    </div>`;
  }).join('');

  document.getElementById('ov-zones').innerHTML = html;
  const pct = total ? filled / total * 100 : 0;
  document.getElementById('ov-bar').style.width = pct + '%';
  const btn = document.getElementById('btn-generate');
  if (!T || !T.raw) {
    btn.style.display = 'none';
    return;
  }
  btn.style.display = 'block';
  btn.style.background = CFG.color;
  const myCompleted = (S.completedZones||[]).filter(k => k.endsWith(myDev)).length;
  const pending = ZONAS.length - myCompleted;
  btn.textContent = allDone ? 'Ver resumen →'
    : `Ver resumen (${pending} zona${pending!==1?'s':''} pendiente${pending!==1?'s':''})`;
  btn.title = 'El Excel se genera desde admin.html';
}

// ── Validación ─────────────────────────────────────────────────────────────

function renderValidation() {
  const el = document.getElementById('validation-out');
  document.getElementById('gen-hdr').style.background = CFG?.color || '#667eea';
  if (!S) { el.innerHTML = '<p style="color:#888">Sin sesión.</p>'; return; }

  // Calcular totales por cod
  const totales = {}; // cod → qty_base
  for (const [zid, zc] of Object.entries(S.countsByZone||{})) {
    for (const [cod, qty] of Object.entries(zc)) {
      // getPresOptions, no presMap: incluye los defaults por unidad, que es lo que
      // aplica el export (factorDefault en js/sesion-merge.js). Con presMap a secas
      // la pantalla de validación mostraba el conteo sin convertir.
      const f = (S.presChoiceByZone?.[zid]?.[cod]) ?? (getPresOptions(cod)[0]?.factor ?? 1);
      totales[cod] = (totales[cod] || 0) + cantidadBaseInv(qty, f);
    }
  }
  const countedCods = Object.keys(totales);

  const allItems = ZONAS.flatMap(z => z.items);
  const allCods  = [...new Set(allItems.map(i => i.cod))];
  const notCounted = allCods.filter(cod => totales[cod] === undefined);
  const withConv   = countedCods.filter(cod => getPresOptions(cod).length > 0);

  let html = '';
  if (!T || !T.raw) {
    html += `<div class="alert alert-error"><div class="alert-title">${ic('circle-x',15)} Plantilla Xetux no disponible</div>El administrador debe configurar la plantilla de este almacén.</div>`;
  }
  if (notCounted.length) {
    const sample = notCounted.slice(0,5).map(cod => allItems.find(i=>i.cod===cod)?.art||cod);
    html += `<div class="alert alert-warn"><div class="alert-title">${ic('triangle-alert',15)} ${notCounted.length} artículos sin contar → quedarán en blanco</div><div>${sample.join(', ')}${notCounted.length>5?' y '+(notCounted.length-5)+' más…':''}</div></div>`;
  }
  const manualesReales = (S.manuales || []).filter(m => m.type !== 'comment');
  if (manualesReales.length) {
    html += `<div class="alert alert-info"><div class="alert-title">${ic('clipboard-list',15)} ${manualesReales.length} ítem${manualesReales.length!==1?'s':''} no catalogado${manualesReales.length!==1?'s':''}</div>
      <div>${manualesReales.map(m=>esc(m.nombre)+' — '+m.cantidad+' '+esc(m.uni)).join(', ')}</div>
      <div style="margin-top:8px"><button class="btn btn-gray btn-sm" style="width:auto;display:inline-block" onclick="compartirManuales()">Compartir lista</button></div></div>`;
  }
  const comentariosSup = (S.manuales || []).filter(m => m.type === 'comment');
  if (comentariosSup.length) {
    html += `<div class="alert" style="background:#f3e8ff;border-color:#c4b5fd;color:#6d28d9"><div class="alert-title">${ic('message-circle',15)} ${comentariosSup.length} comentario${comentariosSup.length!==1?'s':''} de supervisor</div></div>`;
  }
  const desglosados = Object.values(S.countsByZone || {}).reduce((s, zc) => s + Object.values(zc || {}).filter(esDesglose).length, 0);
  html += `<div class="alert alert-ok"><div class="alert-title">${ic('circle-check',15)} ${countedCods.length} artículos con cantidad</div>
    <div>${withConv.length} con conversión · ${countedCods.length - withConv.length} directos${desglosados ? ' · ' + desglosados + ' con desglose' : ''}</div></div>`;

  el.innerHTML = html;
}


// ── Manuales ───────────────────────────────────────────────────────────────

function openManualModal(editId) {
  const existing = editId ? (S.manuales||[]).find(m => m.id === editId) : null;
  document.getElementById('man-modal-title').textContent = existing ? 'Editar no catalogado' : 'Ítem no catalogado';
  document.getElementById('man-edit-id').value = editId || '';
  document.getElementById('man-nombre').value = existing?.nombre || '';
  renderTemplateDatalist();
  document.getElementById('man-unidad').value = existing?.uni || existing?.unidad || '';
  const hasPres = !!(existing?.factor && existing.factor !== 1);
  document.getElementById('man-pres-toggle').checked = hasPres;
  document.getElementById('man-pres-block').style.display = hasPres ? '' : 'none';
  document.getElementById('man-pres-nombre').value = existing?.presentacion || '';
  document.getElementById('man-pres-factor').value = existing?.factor || '';
  // Si tiene presentación mostrar cantidadRaw, si no la cantidad base
  document.getElementById('man-cantidad').value = existing ? (hasPres ? (existing.cantidadRaw ?? existing.cantidad) : existing.cantidad) : '';
  _manFotoB64 = existing?.foto || null;
  document.getElementById('man-foto-preview').innerHTML = _manFotoB64 ? `<img src="${_manFotoB64}" style="max-width:100%;border-radius:8px;margin-top:4px">` : '';
  document.getElementById('man-foto').value = '';
  updateManualCantidadLabel();
  updateManualTemplateHint();
  document.getElementById('modal-manuales-lista').classList.remove('active');
  document.getElementById('modal-manual').classList.add('active');
}

function closeManualModal() {
  document.getElementById('modal-manual').classList.remove('active');
}

function toggleManualPres(on) {
  document.getElementById('man-pres-block').style.display = on ? '' : 'none';
  updateManualCantidadLabel();
}

function updateManualCantidadLabel() {
  const on     = document.getElementById('man-pres-toggle').checked;
  const factor = parseFloat(document.getElementById('man-pres-factor').value);
  const pres   = document.getElementById('man-pres-nombre').value.trim();
  const uni    = document.getElementById('man-unidad').value.trim();
  const label  = document.getElementById('man-cantidad-label');
  const hint   = document.getElementById('man-pres-hint');
  if (on && factor > 0) {
    label.textContent = `Cantidad (${pres || 'presentaciones'}) *`;
    hint.textContent  = `→ 1 ${pres || 'unidad'} = ${factor} ${uni || 'unidad base'}`;
  } else {
    label.textContent = 'Cantidad *';
    if (hint) hint.textContent = '';
  }
}

function updateManualTemplateHint() {
  const hint = document.getElementById('man-template-hint');
  if (!hint) return;
  const item = resolveTemplateItem(document.getElementById('man-nombre')?.value);
  if (!item) {
    hint.textContent = 'Si existe en plantilla, puedes buscarlo por nombre o código aquí.';
    hint.style.color = '#64748b';
    return;
  }
  hint.textContent = `En plantilla: ${item.art} (${item.cod})`;
  hint.style.color = '#166534';
}

function openManualesLista() {
  const lista = document.getElementById('manuales-lista-body');
  const manuales = (S.manuales || []).filter(m => m.type !== 'comment');
  if (!manuales.length) { lista.innerHTML = '<p style="color:#94a3b8;text-align:center;padding:20px">Sin no catalogados aún.</p>'; }
  else {
    lista.innerHTML = manuales.map(m => {
      const factor = m.factor && m.factor !== 1 ? m.factor : null;
      const cantStr = factor
        ? `${m.cantidadRaw ?? m.cantidad} ${m.presentacion || 'uds'} = ${m.cantidad} ${m.uni}`
        : `${m.cantidad} ${m.uni}`;
      const fotoHtml = m.foto ? `<img src="${m.foto}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;flex-shrink:0">` : '';
      return `<div style="display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #f1f5f9">
        ${fotoHtml}
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px">${esc(m.nombre)}</div>
          <div style="font-size:13px;color:#64748b">${esc(cantStr)} · ${esc(m.zona || '')}</div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button onclick="openManualModal('${m.id}')" style="background:#dbeafe;color:#1d4ed8;border:none;border-radius:6px;padding:6px 10px;font-size:13px;font-weight:bold;cursor:pointer">${ic('pencil',14)}</button>
          <button onclick="deleteManual('${m.id}')" style="background:#fee2e2;color:#dc2626;border:none;border-radius:6px;padding:6px 10px;font-size:13px;font-weight:bold;cursor:pointer">${ic('trash-2',14)}</button>
        </div>
      </div>`;
    }).join('');
  }
  document.getElementById('modal-manuales-lista').classList.add('active');
}

function deleteManual(id) {
  if (!confirm('¿Borrar este ítem?')) return;
  S.manuales = (S.manuales || []).filter(m => m.id !== id);
  lsSet('s', S);
  scheduleSyncSesion();
  updateManualesBadge();
  openManualesLista(); // refrescar lista
}

function updateManualesBadge() {
  const n = (S.manuales || []).filter(m => m.type !== 'comment').length;
  const btn = document.getElementById('btn-ver-manuales');
  const badge = document.getElementById('manuales-count-badge');
  if (btn) btn.style.display = n > 0 ? '' : 'none';
  if (badge) badge.textContent = n;
}

async function previewFoto(inp) {
  if (!inp.files[0]) return;
  const file = inp.files[0];
  const img  = new Image();
  img.onload = () => {
    const MAX = 800;
    const scale = Math.min(1, MAX / Math.max(img.width, img.height));
    const canvas = document.createElement('canvas');
    canvas.width = img.width * scale; canvas.height = img.height * scale;
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    _manFotoB64 = canvas.toDataURL('image/jpeg', 0.75);
    document.getElementById('man-foto-preview').innerHTML = `<img src="${_manFotoB64}" style="max-width:100%;border-radius:8px;margin-top:4px">`;
  };
  img.src = URL.createObjectURL(file);
}

function saveManual() {
  const nombre      = document.getElementById('man-nombre').value.trim();
  const cantidadRaw = parseFloat(document.getElementById('man-cantidad').value);
  const uni         = document.getElementById('man-unidad').value.trim();
  const hasPres     = document.getElementById('man-pres-toggle').checked;
  const factor      = hasPres ? parseFloat(document.getElementById('man-pres-factor').value) : 1;
  const presNombre  = hasPres ? document.getElementById('man-pres-nombre').value.trim() : '';
  const editId      = document.getElementById('man-edit-id').value;
  if (!nombre)            { alert('Ingresa el nombre'); return; }
  if (isNaN(cantidadRaw)) { alert('Ingresa la cantidad'); return; }
  if (hasPres && (isNaN(factor) || factor <= 0)) { alert('Ingresa un factor válido'); return; }
  const cantidad = parseFloat((cantidadRaw * (hasPres ? factor : 1)).toFixed(4));
  const templateItem = resolveTemplateItem(nombre);
  if (templateItem && CZ !== null) {
    const zid = myZoneKey(CZ);
    if (!S.countsByZone) S.countsByZone = {};
    if (!S.countsByZone[zid]) S.countsByZone[zid] = {};
    S.countsByZone[zid][templateItem.cod] = hasPres ? cantidadRaw : cantidad;
    if (hasPres) {
      if (!S.presChoiceByZone) S.presChoiceByZone = {};
      if (!S.presChoiceByZone[zid]) S.presChoiceByZone[zid] = {};
      S.presChoiceByZone[zid][templateItem.cod] = factor;
    }
    if (editId) S.manuales = (S.manuales || []).filter(m => m.id !== editId);
    markCorrection(zid, templateItem.cod, editId ? 'manual_convertido' : 'manual_a_plantilla');
    lsSet('s', S);
    syncSesionWorker();
    renderCountList(ZONAS[CZ].items, zid);
    filterCount(document.getElementById('count-search')?.value || '');
    updateProgress();
    updateManualesBadge();
    closeManualModal();
    return;
  }
  const zona = CZ !== null ? ZONAS[CZ].nombre : CFG.titulo;
  const manual = {
    id:           editId || newManualId(),
    nombre, cantidad, uni, zona,
    cantidadRaw:  hasPres ? cantidadRaw : undefined,
    factor:       hasPres ? factor : undefined,
    presentacion: hasPres ? presNombre : undefined,
    foto:         _manFotoB64 !== null ? _manFotoB64 : (editId ? (S.manuales||[]).find(m=>m.id===editId)?.foto || null : null),
    deviceId:     getDeviceId(),
    createdAt:    editId ? (S.manuales||[]).find(m=>m.id===editId)?.createdAt : new Date().toISOString(),
    updatedAt:    new Date().toISOString()
  };
  if (!S.manuales) S.manuales = [];
  if (editId) {
    const idx = S.manuales.findIndex(m => m.id === editId);
    if (idx >= 0) S.manuales[idx] = manual; else S.manuales.push(manual);
  } else {
    S.manuales.push(manual);
  }
  lsSet('s', S);
  scheduleSyncSesion();
  updateManualesBadge();
  closeManualModal();
  alert(editId ? '✓ Actualizado' : '✓ Guardado');
}

// ── Supervisor ─────────────────────────────────────────────────────────────

function renderSupBadge() {
  const wrap = document.getElementById('sup-badge-wrap');
  if (!wrap) return;
  if (_supervisorActual) {
    wrap.innerHTML = `<span class="sup-badge" onclick="logoutSupervisor()" title="Toca para cerrar sesión">${ic('lock',12)} ${esc(_supervisorActual.nombre)}</span>`;
  } else {
    wrap.innerHTML = `<span class="sup-badge" onclick="document.getElementById('modal-supervisor-login').classList.add('active')" title="Acceso supervisor">${ic('lock',12)} Supervisar</span>`;
  }
}

async function loginSupervisor() {
  const nombre = document.getElementById('sup-nombre').value.trim();
  const pin    = document.getElementById('sup-pin').value.trim();
  const errEl  = document.getElementById('sup-login-error');
  errEl.style.display = 'none';
  if (!nombre) { errEl.textContent = 'Escribe tu nombre'; errEl.style.display = ''; return; }
  if (!pin)    { errEl.textContent = 'Escribe el PIN'; errEl.style.display = ''; return; }
  try {
    const r = await fetch(WORKER_URL + '/inv/sesion', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'inv_supervisor_login', appVersion: APP_VERSION, nombre, pin })
    });
    const d = await r.json();
    if (!d.ok) { errEl.textContent = d.error || 'PIN incorrecto'; errEl.style.display = ''; return; }
    _supervisorActual = d.usuario;
    localStorage.setItem('inv_supervisor', JSON.stringify(_supervisorActual));
    document.getElementById('modal-supervisor-login').classList.remove('active');
    document.getElementById('sup-pin').value = '';
    renderSupBadge();
    renderCountListIfActive();
  } catch(e) { errEl.textContent = 'Error de conexión'; errEl.style.display = ''; }
}

function logoutSupervisor() {
  if (!confirm('¿Cerrar sesión de supervisor?')) return;
  _supervisorActual = null;
  localStorage.removeItem('inv_supervisor');
  renderSupBadge();
  renderCountListIfActive();
}

function renderCountListIfActive() {
  if (CZ !== null && ZONAS?.[CZ]) renderCountList(ZONAS[CZ].items, myZoneKey(CZ));
}

// ── Comentarios de supervisor ───────────────────────────────────────────────

function getComment(cod) {
  return (S.manuales || []).find(m => m.type === 'comment' && m.cod === cod) || null;
}

function openCommentModal(cod, nombre) {
  if (!_supervisorActual) return;
  _commentTargetCod = cod;
  const existing = getComment(cod);
  document.getElementById('comment-modal-title').textContent = nombre;
  document.getElementById('comment-text').value = existing?.texto || '';
  const delBtn = document.getElementById('btn-delete-comment');
  delBtn.style.display = existing ? '' : 'none';
  document.getElementById('modal-comment').classList.add('active');
  setTimeout(() => document.getElementById('comment-text').focus(), 100);
}

function saveComment() {
  const texto = document.getElementById('comment-text').value.trim();
  const cod   = _commentTargetCod;
  if (!cod) return;
  if (!S.manuales) S.manuales = [];
  const idx = S.manuales.findIndex(m => m.type === 'comment' && m.cod === cod);
  if (texto) {
    const entry = { id: idx >= 0 ? S.manuales[idx].id : newManualId(),
      type: 'comment', cod, texto,
      supervisor: _supervisorActual.nombre, zona: CZ !== null ? ZONAS[CZ].nombre : '',
      ts: new Date().toISOString() };
    if (idx >= 0) S.manuales[idx] = entry; else S.manuales.push(entry);
  } else if (idx >= 0) {
    S.manuales.splice(idx, 1);
  }
  lsSet('s', S);
  scheduleSyncSesion();
  document.getElementById('modal-comment').classList.remove('active');
  _commentTargetCod = null;
  renderCountListIfActive();
  updateManualesBadge();
}

function deleteComment() {
  const cod = _commentTargetCod;
  if (!cod) return;
  S.manuales = (S.manuales || []).filter(m => !(m.type === 'comment' && m.cod === cod));
  lsSet('s', S);
  scheduleSyncSesion();
  document.getElementById('modal-comment').classList.remove('active');
  _commentTargetCod = null;
  renderCountListIfActive();
}

async function compartirManuales() {
  const lista = (S.manuales || []).filter(m => m.type !== 'comment');
  if (!lista.length) return;
  const texto = `📋 No catalogados · ${CFG.titulo} · ${S.fecha}\n\n` +
    lista.map(m => `• ${m.nombre} — ${m.cantidad} ${m.uni} (${m.zona})`).join('\n');
  if (navigator.share) {
    try { await navigator.share({ title: 'Inventario no catalogados', text: texto }); return; } catch(e) {}
  }
  try { await navigator.clipboard.writeText(texto); alert('Lista copiada al portapapeles'); } catch(e) { alert(texto); }
}

// ── Acuse PDF individual y auditable ──────────────────────────────────────

function loadReceiptPdfLibrary() {
  if (window.html2pdf) return Promise.resolve(window.html2pdf);
  if (_receiptPdfLoader) return _receiptPdfLoader;
  _receiptPdfLoader = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = new URL('vendor/html2pdf.bundle.min.js?v=0.10.1', document.baseURI).href;
    script.onload = () => window.html2pdf
      ? resolve(window.html2pdf)
      : reject(new Error('La librería PDF no quedó disponible'));
    script.onerror = () => reject(new Error('No se pudo cargar el generador PDF local'));
    document.head.appendChild(script);
  }).catch(error => {
    _receiptPdfLoader = null;
    throw error;
  });
  return _receiptPdfLoader;
}

function receiptNumber(value) {
  const n = Number(value);
  return Number.isFinite(n) ? String(Number(n.toFixed(4))) : '0';
}

function receiptCaptureText(item) {
  if (item.mode === 'breakdown') {
    return (item.lines || []).map(line => {
      const name = line.name || 'Abierto / suelto';
      return `${receiptNumber(line.quantity)} × ${name} (${receiptNumber(line.factor)} ${item.unit || 'base'})`;
    }).join(' + ') || 'Sin líneas';
  }
  if (Number(item.factor) !== 1) {
    return `${receiptNumber(item.entered)} × ${item.presentation || 'presentación'} ` +
      `(${receiptNumber(item.factor)} ${item.unit || 'base'})`;
  }
  return `${receiptNumber(item.entered)} ${item.unit || ''}`.trim();
}

function receiptFilename(receipt) {
  const safe = value => String(value || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^A-Za-z0-9_-]+/g, '_')
    .replace(/^_+|_+$/g, '');
  return `Acuse_${safe(receipt.almacen)}_${safe(receipt.fecha)}_Zona-${Number(receipt.zoneIndex) + 1}_${safe(receipt.id)}.pdf`;
}

async function downloadReceiptById(id) {
  try {
    let receipt = (S?.receipts || []).find(item => item.id === id);
    if (!receipt || !Array.isArray(receipt.items)) {
      const response = await fetch(WORKER_URL + '/inv/receipt?id=' + encodeURIComponent(id));
      const data = await response.json();
      if (!response.ok || !data.ok || !data.found) throw new Error('Acuse no encontrado en el servidor');
      receipt = data.receipt;
      mergeServerReceipts([receipt]);
    }
    await downloadReceiptPdf(receipt, false);
  } catch (error) {
    alert('No se pudo descargar el acuse: ' + error.message);
  }
}

async function downloadReceiptPdf(receipt, automatic = false) {
  if (!receipt?.id || !receipt?.hash) throw new Error('El acuse no tiene folio o huella');
  await loadReceiptPdfLibrary();

  const verificationUrl = WORKER_URL + '/inv/receipt?id=' + encodeURIComponent(receipt.id);
  const received = receipt.receivedAt
    ? new Date(receipt.receivedAt).toLocaleString('es-MX', {
        dateStyle:'medium',
        timeStyle:'medium',
        timeZone:OPERATING_TIME_ZONE
      })
    : '—';
  const itemRows = (receipt.items || []).map((item, index) => `
    <tr style="background:${index % 2 ? '#f8fafc' : '#fff'};page-break-inside:avoid">
      <td>${esc(item.code)}</td>
      <td>${esc(item.name)}</td>
      <td>${esc(receiptCaptureText(item))}</td>
      <td style="text-align:right;font-weight:700">${esc(receiptNumber(item.baseQuantity))}</td>
      <td>${esc(item.unit || '')}</td>
    </tr>`).join('');
  const manualRows = (receipt.manualItems || []).map((item, index) => `
    <tr style="background:${index % 2 ? '#fff7ed' : '#fffbeb'};page-break-inside:avoid">
      <td>${esc(item.name)}</td>
      <td style="text-align:right;font-weight:700">${esc(receiptNumber(item.quantity))}</td>
      <td>${esc(item.unit || '')}</td>
      <td>${item.presentation ? esc(item.presentation) : 'Captura directa'}${item.photoAttached ? ' · con foto' : ''}</td>
    </tr>`).join('');
  const container = document.createElement('div');
  container.style.cssText =
    'position:relative;z-index:20000;width:760px;background:#fff;color:#1f2937;' +
    'font-family:Arial,sans-serif;font-size:11px;line-height:1.35;padding:22px';
  container.innerHTML = `
    <div style="border:2px solid #166534;border-radius:10px;padding:18px">
      <div style="display:flex;justify-content:space-between;gap:20px;align-items:flex-start">
        <div>
          <div style="font-size:10px;letter-spacing:1.2px;color:#166534;font-weight:800">CONFIRMADO POR EL SERVIDOR</div>
          <h1 style="font-size:20px;margin:4px 0 2px">Acuse de recepción de conteo</h1>
          <div style="color:#64748b">${esc(CENTROS[centroDe(receipt.almacen)]?.nombre || CENTROS[CENTRO].nombre)}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:9px;color:#64748b">FOLIO</div>
          <div style="font-size:11px;font-weight:800;color:#166534">${esc(receipt.id)}</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin-top:16px;padding:12px;background:#f0fdf4;border-radius:7px">
        <div><strong>Almacén:</strong> ${esc(receipt.almacen)}</div>
        <div><strong>Fecha operativa:</strong> ${esc(receipt.fecha)}</div>
        <div><strong>Zona:</strong> ${esc(receipt.zoneName || `Zona ${Number(receipt.zoneIndex) + 1}`)}</div>
        <div><strong>Operario declarado:</strong> ${esc(receipt.operario)}</div>
        <div><strong>Recibido (CDMX):</strong> ${esc(received)}</div>
        <div><strong>Dispositivo:</strong> ${esc(receipt.deviceId)}</div>
      </div>
      <h2 style="font-size:14px;margin:18px 0 7px">Artículos catalogados (${(receipt.items || []).length})</h2>
      <table style="width:100%;border-collapse:collapse;font-size:10px">
        <thead><tr style="background:#166534;color:#fff">
          <th>Código</th><th>Artículo</th><th>Captura original</th>
          <th style="text-align:right">Cantidad base</th><th>Unidad</th>
        </tr></thead>
        <tbody>${itemRows || '<tr><td colspan="5" style="padding:10px;text-align:center">Zona cerrada sin cantidades catalogadas.</td></tr>'}</tbody>
      </table>
      ${(receipt.manualItems || []).length ? `
        <h2 style="font-size:14px;margin:18px 0 7px">No catalogados (${receipt.manualItems.length})</h2>
        <table style="width:100%;border-collapse:collapse;font-size:10px">
          <thead><tr style="background:#92400e;color:#fff">
            <th>Artículo</th><th style="text-align:right">Cantidad base</th><th>Unidad</th><th>Evidencia</th>
          </tr></thead>
          <tbody>${manualRows}</tbody>
        </table>` : ''}
      <div style="margin-top:18px;padding:11px;border:1px solid #cbd5e1;border-radius:7px;background:#f8fafc;font-size:9px">
        <strong>Alcance del acuse.</strong> Este documento acredita que el servidor recibió del dispositivo
        indicado exactamente las capturas listadas. No representa aprobación final ni incorpora correcciones
        posteriores de administración. Si la zona se reabre y vuelve a cerrarse, se emite un folio nuevo y este
        acuse permanece en el historial.
      </div>
      <div style="margin-top:12px;font-size:8px;color:#475569;word-break:break-all">
        <strong>SHA-256 del contenido:</strong> ${esc(receipt.hash)}<br>
        <strong>Verificación:</strong> <a href="${esc(verificationUrl)}">${esc(verificationUrl)}</a><br>
        <strong>Plantilla:</strong> ${esc(receipt.templateHash || '—')} ·
        <strong>Evento:</strong> ${esc(receipt.eventId || '—')}
      </div>
    </div>
    <style>
      th,td{border:1px solid #d1d5db;padding:5px;text-align:left;vertical-align:top}
      thead{display:table-header-group}
    </style>`;
  const cover = document.createElement('div');
  cover.setAttribute('data-html2canvas-ignore', 'true');
  cover.style.cssText =
    'position:fixed;inset:0;z-index:20001;background:#f0fdf4;color:#166534;' +
    'display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;' +
    'padding:28px;font:800 16px system-ui,sans-serif';
  cover.innerHTML =
    '✓ Conteo confirmado por el servidor' +
    '<span style="font-size:12px;font-weight:500;margin-top:8px">Generando tu acuse PDF…</span>';
  document.body.prepend(container);
  document.body.appendChild(cover);

  try {
    await window.html2pdf().set({
      margin: 8,
      filename: receiptFilename(receipt),
      image: { type: 'jpeg', quality: 0.94 },
      html2canvas: { scale: 1.4, useCORS: false, logging: false },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true },
      pagebreak: { mode: ['css', 'legacy'] }
    }).from(container).save();
    _lastZoneClosedMsg =
      `Acuse ${receipt.id} confirmado por el servidor y PDF ${automatic ? 'descargado automáticamente' : 'descargado'}.`;
    if (document.getElementById('screen-overview')?.classList.contains('active')) renderOverview();
  } finally {
    cover.remove();
    container.remove();
  }
}
