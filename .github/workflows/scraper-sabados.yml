name: Scraper domingos — catálogos, recetas e inventarios cerrados

on:
  schedule:
    - cron: '0 4 * * 0'   # domingos 10pm Ciudad de México (UTC-6)
  workflow_dispatch:

jobs:
  scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar Playwright
        run: python3 -m playwright install chromium --with-deps

      - name: Crear .env
        run: |
          cat > .env << EOF
          POS_URL=${{ secrets.POS_URL }}
          POS_USER=${{ secrets.POS_USER }}
          POS_PASSWORD=${{ secrets.POS_PASSWORD }}
          SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}
          WORKER_URL=${{ secrets.WORKER_URL }}
          SYNC_TOKEN=${{ secrets.SYNC_TOKEN }}
          EOF

      - name: Descargar catálogos y recetas
        run: python3 scraper_catalogos.py

      - name: Descargar ventas consolidado de la semana
        run: |
          DOMINGO=$(date -d 'today' +%Y-%m-%d)
          LUNES=$(date -d "$DOMINGO - 6 days" +%Y-%m-%d)
          echo "Consolidado semana: $LUNES → $DOMINGO"
          python3 scraper_reportes.py --from "$LUNES" --to "$DOMINGO"

      - name: Sincronizar catálogo e inventarios cerrados con D1
        run: python3 sync_d1.py --catalogo --inventario-cerrado

      - name: Reporte semanal a Slack
        run: |
          DOMINGO=$(date -d 'today' +%Y-%m-%d)
          LUNES=$(date -d "$DOMINGO - 6 days" +%Y-%m-%d)
          python3 slack_reportes.py --semanal --desde "$LUNES" --hasta "$DOMINGO"
