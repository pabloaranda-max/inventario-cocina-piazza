name: Reporte semanal de costos — Slack

on:
  # schedule:  # DESACTIVADO 2026-07-02 (slice 0 — scraper falla a diario, estacionado)
    # - cron: '0 14 * * 1'   # lunes 8am Ciudad de México (UTC-6)
  workflow_dispatch:

jobs:
  reporte:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Crear .env
        run: |
          cat > .env << EOF
          POS_URL=${{ secrets.POS_URL }}
          POS_USER=${{ secrets.POS_USER }}
          POS_PASSWORD=${{ secrets.POS_PASSWORD }}
          SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}
          WORKER_URL=${{ secrets.WORKER_URL }}
          SYNC_TOKEN=${{ secrets.SYNC_TOKEN }}
          EOF

      # Los XLS del scraper diario se descargan en el job de scraper.
      # Para que estén disponibles aquí, el job diario sube los downloads como artifact.
      # Por ahora: descargar el inventario actual + ventas/compras de la semana.
      - name: Instalar Playwright
        run: python3 -m playwright install chromium --with-deps

      - name: Descargar y reportar semana anterior
        run: |
          # Semana anterior: domingo pasado y el lunes de esa semana
          # Robusto tanto si corre lunes como cualquier otro día
          DOMINGO=$(date -d 'last sunday' +%Y-%m-%d)
          LUNES=$(date -d "$DOMINGO - 6 days" +%Y-%m-%d)
          echo "Semana: $LUNES → $DOMINGO"
          python3 scraper_reportes.py --from "$LUNES" --to "$DOMINGO"
          python3 slack_reportes.py --semanal --desde "$LUNES" --hasta "$DOMINGO"
