name = "operaciones-api"
main = "src/index.js"
compatibility_date = "2024-01-01"
account_id = "ee88d3b7085fc0e166ee75e77918e6c6"

[triggers]
crons = ["0 10 * * 6", "0 10 28-31 * *"]

# R12 — versión mínima de app aceptada en POST /inv/*. Bumpear SOLO después de
# que Pages sirva el frontend nuevo (playbook spec §15 R12).
# v1 = desglose R11; v2 = cierre con acuse auditable R23.
[vars]
MIN_APP_VERSION = "2"

[[d1_databases]]
binding = "DB"
database_name = "operaciones-db"
database_id = "5ebb6fac-baca-418d-9361-bb13d7cc1190"

[env.staging]
triggers = { crons = [] }
vars = { MIN_APP_VERSION = "1" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "operaciones-db-staging"
database_id = "56ecc5a3-9ae4-4dc6-943d-95301bbdd8f5"
